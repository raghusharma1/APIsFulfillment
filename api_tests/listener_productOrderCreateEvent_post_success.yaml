      - get:
          url: "/listener/productOrderCreateEvent/{{ id }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.nnnn_AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "notification"
            - hasProperty: "order"
